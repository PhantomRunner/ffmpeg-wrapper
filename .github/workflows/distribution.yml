name: Native distribution verification
on:
  workflow_dispatch:
    inputs:
      candidate_archives:
        description: Upload portable release-candidate archives (no public release)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0 libatomic1
      - name: Install Windows test FFmpeg (never copied into bundle)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -r packaging/requirements.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip check
      - run: python scripts/build_distribution.py
      - run: python scripts/verify_distribution.py dist/MediaWrapper
      - run: python scripts/archive_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-inventory-${{ runner.os }}
          path: |
            dist/MediaWrapper/build-info.json
            dist/MediaWrapper/SHA256SUMS.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_archives
        with:
          name: MediaWrapper-candidate-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/MediaWrapper-*.zip
            dist/MediaWrapper-*.tar.gz
            dist/MediaWrapper-*.sha256
          if-no-files-found: error
          retention-days: 14
