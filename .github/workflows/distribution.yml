name: Native distributions
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Build and verify on Debian 11 and Ubuntu 22.04
        run: bash scripts/build_appimage.sh --output-dir dist/linux-x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MediaWrapper-Linux-x86_64-reports
          path: |
            dist/linux-x86_64/reports/**
            dist/linux-x86_64/*.json
            dist/linux-x86_64/MediaWrapper/build-info.json
            dist/linux-x86_64/MediaWrapper/SHA256SUMS.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request'
        with:
          name: MediaWrapper-Linux-x86_64
          path: |
            dist/linux-x86_64/MediaWrapper-*.tar.gz
            dist/linux-x86_64/MediaWrapper-*.AppImage
            dist/linux-x86_64/MediaWrapper-*.sha256
            dist/linux-x86_64/MediaWrapper-*.json
          if-no-files-found: error
          retention-days: 14
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install external test FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows-x86_64/reports | Out-Null
          choco install ffmpeg -y --no-progress 2>&1 | Tee-Object -FilePath dist/windows-x86_64/reports/ffmpeg-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build ZIP and installer and verify installation lifecycle
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Python (Get-Command python).Source -OutputDir dist/windows-x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MediaWrapper-Windows-x86_64-reports
          path: |
            dist/windows-x86_64/reports/**
            dist/windows-x86_64/*.json
            dist/windows-x86_64/MediaWrapper/build-info.json
            dist/windows-x86_64/MediaWrapper/SHA256SUMS.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request'
        with:
          name: MediaWrapper-Windows-x86_64
          path: |
            dist/windows-x86_64/MediaWrapper-*.zip
            dist/windows-x86_64/MediaWrapper-*-setup.exe
            dist/windows-x86_64/MediaWrapper-*.sha256
            dist/windows-x86_64/MediaWrapper-*.json
          if-no-files-found: error
          retention-days: 14
