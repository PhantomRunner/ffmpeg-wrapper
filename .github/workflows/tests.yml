name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0 libatomic1
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -e ".[dev]"
      - name: Require working binaries (integration tests must not silently skip)
        run: python -c "from media_wrapper.infrastructure.ffmpeg.binary_resolver import resolve; print(resolve())"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: Flat workbench high-DPI regressions
        env:
          QT_SCALE_FACTOR: '2'
        run: python -m pytest -q tests/test_flat_shell.py tests/test_flat_workbench.py tests/test_flat_accessibility.py tests/test_source_table.py tests/test_settings_inspector.py tests/test_persistent_history.py tests/test_named_presets.py tests/test_workbench_preferences.py tests/test_ui_theme.py tests/test_ux_remediation.py tests/test_encoding_workflows.py
