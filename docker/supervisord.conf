[supervisord]
nodaemon=true
logfile=/tmp/desktop/supervisor.log
pidfile=/tmp/desktop/supervisor.pid
childlogdir=/tmp/desktop

[unix_http_server]
file=/tmp/desktop/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/desktop/supervisor.sock

[program:display]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
priority=10
autorestart=true
stopasgroup=true
killasgroup=true

[program:window-manager]
command=/usr/bin/openbox
priority=20
autorestart=true
startretries=10
stopasgroup=true

[program:vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -noxdamage
priority=30
autorestart=true
startretries=10
stopasgroup=true

[program:web]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true
stopasgroup=true

[program:application]
command=/usr/local/bin/python /opt/media-wrapper/packaging/launcher.py
directory=/media
priority=50
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=20
