name: media-wrapper
services:
  app:
    build:
      context: .
      target: development
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    ports:
      - "127.0.0.1:${WEB_PORT:-6080}:6080"
    volumes:
      - ./src:/opt/media-wrapper/src:ro
      - ${MEDIA_DIR:-./media}:/media:ro
      - ${OUTPUT_DIR:-./output}:/output
      - app-home:/home/app
    environment:
      DISPLAY: ":99"
      QT_QPA_PLATFORM: xcb
      QT_OPENGL: software
      PYTHONPATH: /opt/media-wrapper/src
      XDG_RUNTIME_DIR: /tmp/runtime-app
    shm_size: 256mb
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/python", "/opt/desktop/healthcheck.py"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      QT_QPA_PLATFORM: offscreen
    init: true
volumes:
  app-home:
