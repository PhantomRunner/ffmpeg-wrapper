[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ffmpeg-ui-wrapper"
version = "0.1.0"
description = "Cross-platform FFmpeg desktop frontend"
requires-python = ">=3.11,<3.13"
dependencies = ["PySide6==6.7.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
media-wrapper = "media_wrapper.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/media_wrapper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
